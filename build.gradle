plugins {
    id 'project-report'
    id 'java'
    id 'java-library'
    id 'maven-publish'
    id 'io.quarkus'
    id "com.jfrog.artifactory" version "6.0.4"
    id "io.freefair.lombok" version "6.5.0.3"
    id "org.sonarqube" version "4.0.0.2929"
    id 'jacoco'
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        csv.required = false
        html.required = false
    }

    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: [
                    "com/dlt/zeta/document/entity/**/*"
            ]
            )
        }))
    }

}

dependencies {
    implementation platform("${quarkusPlatformGroupId}:${quarkusPlatformArtifactId}:${quarkusPlatformVersion}")

    annotationProcessor 'org.projectlombok:lombok:1.18.30'
    implementation 'io.quarkus:quarkus-smallrye-openapi'

    implementation 'io.quarkus:quarkus-arc'
    implementation 'io.quarkiverse.vault:quarkus-vault'
    implementation 'io.quarkus:quarkus-config-yaml'
    implementation 'io.quarkus:quarkus-smallrye-health'
    implementation 'io.quarkus:quarkus-smallrye-fault-tolerance'
    implementation("io.quarkus:quarkus-logging-json")
    implementation 'org.apache.commons:commons-text'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'

    //REST
    implementation "io.quarkus:quarkus-rest"
    implementation 'io.quarkus:quarkus-hibernate-validator'
    implementation "io.quarkus:quarkus-rest-jackson"
    implementation "io.quarkus:quarkus-rest-client-jackson"

    //datasource
    implementation 'io.quarkus:quarkus-flyway'
    implementation 'io.quarkus:quarkus-jdbc-postgresql'
    implementation 'io.quarkus:quarkus-hibernate-orm-panache'
    implementation 'io.quarkus:quarkus-hibernate-validator'
    implementation "dev.langchain4j:langchain4j-milvus:0.35.0"

    //aws
    implementation "io.quarkiverse.amazonservices:quarkus-amazon-s3:3.12.0"
    implementation "software.amazon.awssdk:url-connection-client:2.35.10"
    implementation 'software.amazon.awssdk:sts:2.35.10'

    //oidc
    implementation 'io.quarkus:quarkus-oidc'
    implementation 'io.quarkus:quarkus-rest-client-oidc-filter'
    implementation "io.quarkus:quarkus-rest-client-oidc-token-propagation"

    //llm
    implementation 'dev.langchain4j:langchain4j:1.0.1'
    implementation 'dev.langchain4j:langchain4j-open-ai:1.0.1'

    // common lib
    implementation 'com.dlt.zeta.quarkus.common.lib:zeta-quarkus-common-lib:15'

    // PDF
    implementation("org.apache.pdfbox:pdfbox:2.0.30")

    //Temporal
    implementation 'io.temporal:temporal-sdk:1.31.0'
}

group = 'com.dlt.zeta.document'
version = '1.0.0'
description = 'zeta-document-ingestion-svc'
def env = System.getenv()
if (env['BUILD_NUMBER']) {
    version = env['BRANCH_NAME'] == "master" ? env['BUILD_NUMBER'] : env['BRANCH_NAME'] + "-" + env['BUILD_NUMBER']
} else {
    version = version + "-local"
}

compileJava {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-parameters'
}

compileTestJava {
    options.encoding = 'UTF-8'
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}


publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
        if (file("$buildDir/zeta-document-ingestion-svc-${version}-runner").exists()) {
            binary(MavenPublication) {
                artifact source: "$buildDir/zeta-document-ingestion-svc-${version}-runner", classifier: 'bin', extension: ''
            }
        }
        if (file("$buildDir/zeta-document-ingestion-svc-${version}-runner.jar").exists()) {
            binary(MavenPublication) {
                artifact source: "$buildDir/zeta-document-ingestion-svc-${version}-runner.jar", classifier: 'bin', extension: 'jar'
            }
        }
    }
}

tasks.withType(GenerateModuleMetadata).configureEach {
    suppressedValidationErrors.add('enforced-platform')
}

quarkusBuild {
    nativeArgs {
        containerBuild = false
    }
}

artifactory {
    contextUrl = "${artifactory_contextUrl}"   //The base Artifactory URL if not overridden by the publisher/resolver
    publish {
        repository {
            repoKey = 'wp-libs-snapshot-local'
            username = "${artifactory_user}"
            password = "${artifactory_password}"
        }
        defaults {
            publications('mavenJava', "binary")
            publishBuildInfo = false
            publishArtifacts = true
            publishPom = true
        }
    }
}

repositories {
    maven {
        url = "${artifactory_contextUrl}/wp-libs-snapshot"
        credentials {
            username = "${artifactory_user}"
            password = "${artifactory_password}"
        }
    }
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}